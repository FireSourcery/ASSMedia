{
    "extractor": {
        "instagram": {
            "directory": [
                "{post_shortcode}"
            ],
            "filename": "{post_shortcode}_{num:>02}.{extension}",
            "videos": "merged",
            "postprocessors": [
                {
                    "name": "metadata",
                    "event": "post",
                    "filename": "{post_shortcode}.json",
                    "newline": "\n",
                    "skip": true
                }
            ]
        }
    },
    "output": {
        "logfile": {
            "mode": "a",
            "level": "info"
        }
    }
}
