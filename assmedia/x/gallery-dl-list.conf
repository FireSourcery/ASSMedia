{
    "extractor": {
        "twitter": {
            "directory": [],
            "download": false,
            "text-tweets": true,
            "quoted": true,
            "postprocessors": [
                {
                    "name": "metadata",
                    "event": "post",
                    "filename": "{tweet_id}.json",
                    "newline": "\n"
                }
            ]
        }
    },
    "output": {
        "logfile": {
            "mode": "w",
            "level": "info"
        }
    }
}
