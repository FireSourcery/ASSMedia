{
    "extractor": {
        "twitter": {
            "directory": [
                "{tweet_id}"
            ],
            "filename": "{tweet_id}_{num:>02}.{extension}",
            "text-tweets": true,
            "articles": [
                "cover",
                "media"
            ],
            "bookmark": {
                "quoted": true,
                "unique": false,
                "postprocessors": [
                    {
                        "name": "metadata",
                        "event": "post",
                        "filter": "not quote_id",
                        "filename": "{tweet_id}.json",
                        "skip": true
                    },
                    {
                        "name": "metadata",
                        "event": "post",
                        "filter": "quote_id",
                        "filename": "{tweet_id}.quoted.json",
                        "skip": true
                    }
                ]
            },
            "tweet": {
                "conversations": "accessible",
                "quoted": false,
                "file-filter": "author['id'] == user['id']",
                "postprocessors": [
                    {
                        "name": "metadata",
                        "event": "post",
                        "filename": "{tweet_id}.json",
                        "skip": false
                    }
                ]
            }
        }
    },
    "output": {
        "logfile": {
            "mode": "a",
            "level": "info"
        }
    }
}
